[workspace]
resolver = "2"
members = [
    "crates/mocktail-core",
    "crates/mocktail-http",
    "crates/mocktail-infra-sqlite",
    "crates/mocktail-native",
    "crates/mocktail-worker",
]
# The worker crate only builds for wasm32; keep it out of host builds/tests.
default-members = [
    "crates/mocktail-core",
    "crates/mocktail-http",
    "crates/mocktail-infra-sqlite",
    "crates/mocktail-native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["M. Nabil Adani"]

[workspace.dependencies]
# Pure-core deps (must stay wasm32-clean: no tokio, no std::net).
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
base64 = "0.22"

# HTTP interface layer (shared by native and Workers).
axum = { version = "0.8", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
form_urlencoded = "1"

# Infra / native deps.
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "time", "signal"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
rust-embed = "8"
mime_guess = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "tokio", "trace"] }
opentelemetry-prometheus = "0.33"
tracing-opentelemetry = "0.34"

mocktail-core = { path = "crates/mocktail-core" }
mocktail-http = { path = "crates/mocktail-http" }
mocktail-infra-sqlite = { path = "crates/mocktail-infra-sqlite" }
