[package]
name = "mocktail-infra-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# INFRA: implements the repository ports over SQLite. All SQL runs through the
# injected `SqlExecutor` port, so this crate is pure and wasm-clean. The Workers
# composition root supplies a Cloudflare D1 executor, the native binary a sqlx
# file executor, and tests a sqlx in-memory executor.
[dependencies]
mocktail-core.workspace = true
async-trait.workspace = true
rust-embed = { workspace = true, features = ["debug-embed"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
async-trait.workspace = true
sqlx.workspace = true
tokio.workspace = true
