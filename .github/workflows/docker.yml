name: Docker Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/mocktail-native/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/mocktail:latest
            ghcr.io/${{ github.repository }}/mocktail:${{ github.sha }}
